<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Draw &amp; Pass</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<link rel="stylesheet" href="../_shared/kit.css">
<style>
  :root { --s1:#c9c2ff; --s2:#8f85f0; --ss:#5a4fc0; --st:#fff; --ink:#2a2466; --b1:#a99cff; --b2:#6f62e0; --bs:#463ba8; --a1:#7fd3e6; --a2:#3a9fc0; --as:#256f88; }
  #stage { background: linear-gradient(#efeaff 0%, #e4dcff 60%, #c9b98f 60%, #b8a476 100%); }
  .floor { position:absolute; left:0; right:0; bottom:0; height:40%; background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.18) 0 calc(var(--u)*10), transparent calc(var(--u)*10) calc(var(--u)*20)); pointer-events:none; }
  #flat { position:absolute; left:calc(var(--u)*54); width:calc(var(--u)*70); top:calc(var(--u)*63); z-index:2; pointer-events:none; transform-origin:50% 100%; }
  #flat.bounce { animation: kbounce .6s; } #flat.oops { animation: koops .6s; }
  #flat.slide { animation: slide 1s ease-in-out; } @keyframes slide { 45% { transform:translateX(calc(var(--u)*60)); opacity:0; } 55% { transform:translateX(calc(var(--u)*-60)); opacity:0; } }
  #board { position:absolute; left:calc(var(--u)*40); top:calc(var(--u)*13); width:calc(var(--u)*98); height:calc(var(--u)*56); background:#fffdf6; border-radius:calc(var(--u)*3);
    box-shadow:0 0 0 calc(var(--u)*1) #6f62e0, 0 calc(var(--u)*1.6) calc(var(--u)*3) rgba(40,30,100,.35); z-index:5; overflow:hidden; touch-action:none; }
  #cv { position:absolute; inset:0; width:100%; height:100%; display:none; cursor:crosshair; }
  #board.drawing #cv { display:block; }
  .pane { position:absolute; inset:0; display:none; align-items:center; justify-content:center; }
  .pane.on { display:flex; }
  #cmp .half { position:relative; width:46%; height:78%; margin:0 1.5%; background:#fff; border-radius:calc(var(--u)*2); box-shadow:inset 0 0 0 calc(var(--u)*.4) #ddd6ff; overflow:hidden; }
  #cmp .half img { width:100%; height:100%; object-fit:contain; }
  #cmp .lab { position:absolute; top:calc(var(--u)*.6); left:0; right:0; text-align:center; font-size:calc(var(--u)*2.2); color:#6f62e0; z-index:2; }
  .pic { position:relative; width:100%; height:100%; }
  .pic .o { position:absolute; display:flex; align-items:center; justify-content:center; }
  .pic .o svg { width:100%; height:100%; display:block; }
  .pic .o .emo { font-size:inherit; line-height:1; }
  #lookPic { width:70%; height:90%; }
  .r1 { filter:url(#rough1); } .r2 { filter:url(#rough2); }
  /* tools */
  #tools { position:absolute; left:calc(var(--u)*26); top:calc(var(--u)*14); display:none; flex-direction:column; gap:calc(var(--u)*1.2); z-index:8; }
  #colors { position:absolute; left:calc(var(--u)*141); top:calc(var(--u)*14); display:none; grid-template-columns:1fr 1fr; gap:calc(var(--u)*1.2); z-index:8; }
  .drawing-ui #tools { display:flex; } .drawing-ui #colors { display:grid; }
  .tool { width:calc(var(--u)*11); height:calc(var(--u)*11); border-radius:calc(var(--u)*2.4); border:none; background:#fff; box-shadow:0 calc(var(--u)*.6) 0 #c9c2ff; cursor:pointer; display:flex; align-items:center; justify-content:center; font-size:calc(var(--u)*4.6); font-family:inherit; }
  .tool.on { box-shadow:0 0 0 calc(var(--u)*.7) #6f62e0; }
  .tool i { display:block; background:#2a2466; border-radius:50%; }
  .sw { width:calc(var(--u)*10); height:calc(var(--u)*10); border-radius:50%; border:calc(var(--u)*.6) solid #fff; cursor:pointer; box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1) rgba(0,0,0,.25); }
  .sw.on { outline:calc(var(--u)*.7) solid #6f62e0; transform:scale(1.08); }
  #timer { position:absolute; left:calc(var(--u)*40); width:calc(var(--u)*98); top:calc(var(--u)*70.5); height:calc(var(--u)*2); background:rgba(255,255,255,.6); border-radius:calc(var(--u)*1); overflow:hidden; display:none; z-index:6; }
  #timer i { display:block; height:100%; width:100%; background:linear-gradient(90deg,#ffd24d,#ff9f5a); }
  #hg { position:absolute; left:calc(var(--u)*34.5); top:calc(var(--u)*68.6); font-size:calc(var(--u)*4); display:none; z-index:6; }
  .drawing-ui #timer, .drawing-ui #hg { display:block; }
  #doneBtn { position:absolute; right:calc(var(--u)*4); bottom:calc(var(--u)*6); display:none; z-index:20; }
  .drawing-ui #doneBtn { display:block; }
  #sdBtns { position:absolute; left:50%; transform:translateX(-50%); bottom:calc(var(--u)*5); display:none; gap:calc(var(--u)*4); z-index:20; }
  #sdBtns.on { display:flex; } #sdBtns .btn { height:calc(var(--u)*14); font-size:calc(var(--u)*4.4); padding:0 calc(var(--u)*4); }
  .options { left:calc(var(--u)*24); right:calc(var(--u)*24); bottom:calc(var(--u)*4); height:calc(var(--u)*20); }
  .ocard { position:relative; background:#fff; border-radius:calc(var(--u)*2.4); min-width:calc(var(--u)*20); height:calc(var(--u)*18); padding:0 calc(var(--u)*2.4); display:flex; align-items:center; justify-content:center;
    font-size:calc(var(--u)*3.2); cursor:pointer; box-shadow:0 calc(var(--u)*.8) 0 #c9c2ff, 0 calc(var(--u)*1.2) calc(var(--u)*2) rgba(0,0,0,.25); transition:opacity .3s; }
  .ocard .mini { width:calc(var(--u)*14); height:calc(var(--u)*14); }
  .ocard .spk { position:absolute; right:calc(var(--u)*.5); top:calc(var(--u)*.5); width:calc(var(--u)*4); height:calc(var(--u)*4); border-radius:50%; border:none; background:#edf1ff; font-size:calc(var(--u)*2.1); cursor:pointer; }
  .ocard.ok { box-shadow:0 0 0 calc(var(--u)*.9) #2fb457, 0 0 calc(var(--u)*3) #7be08a; } .ocard.dim { opacity:.3; pointer-events:none; }
  .bubble { width:calc(var(--u)*21); font-size:calc(var(--u)*2.5); }
  #passCover { position:absolute; inset:0; background:linear-gradient(#8f85f0,#5a4fc0); z-index:50; display:none; flex-direction:column; align-items:center; justify-content:center; color:#fff; gap:calc(var(--u)*3); }
  #passCover.on { display:flex; } #passCover h2 { margin:0; font-size:calc(var(--u)*7); } #passCover p { margin:0; font-size:calc(var(--u)*3.4); }
  #passCover .flag { font-size:calc(var(--u)*10); }
  #rewind { position:absolute; inset:calc(var(--u)*11) calc(var(--u)*6) calc(var(--u)*4); background:rgba(255,255,255,.96); border-radius:calc(var(--u)*3); z-index:45; display:none; flex-direction:column; align-items:center; padding:calc(var(--u)*2); }
  #rewind.on { display:flex; } #rewind h3 { margin:0 0 calc(var(--u)*1); font-size:calc(var(--u)*4.4); color:#463ba8; }
  #rwRow { display:flex; gap:calc(var(--u)*1.4); align-items:center; flex-wrap:wrap; justify-content:center; }
  .rw-step { width:calc(var(--u)*24); height:calc(var(--u)*22); background:#f6f3ff; border-radius:calc(var(--u)*2); display:flex; flex-direction:column; align-items:center; justify-content:center; padding:calc(var(--u)*1); text-align:center; font-size:calc(var(--u)*2.5); opacity:.15; transition:opacity .4s; }
  .rw-step.on { opacity:1; } .rw-step img { max-width:100%; max-height:calc(var(--u)*16); } .rw-step small { color:#7a72b8; font-size:calc(var(--u)*1.9); }
  #stamp { margin-top:calc(var(--u)*1.5); font-size:calc(var(--u)*3.6); color:#2fb457; min-height:calc(var(--u)*5); }
  #modeBox { position:absolute; left:50%; bottom:calc(var(--u)*33); transform:translateX(-50%); display:flex; gap:calc(var(--u)*1.2); z-index:20; background:rgba(255,255,255,.78); padding:calc(var(--u)*.8); border-radius:calc(var(--u)*4); align-items:center; font-size:calc(var(--u)*2.4); }
  #lineBox { display:none; } #lineBox.on { display:inline-flex; gap:calc(var(--u)*.8); align-items:center; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <filter id="rough1"><feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="3"/><feDisplacementMap in="SourceGraphic" scale="7"/></filter>
  <filter id="rough2"><feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="7"/><feDisplacementMap in="SourceGraphic" scale="13"/></filter>
</svg>
<div id="stage">
  <div class="floor"></div>

  <section class="screen on" id="title">
    <div class="topbar"><div class="row"><button class="btn alt" id="keyBtn">🔑</button></div><div class="row"><button class="btn alt" id="langBtn">한국어</button><button class="btn alt sndBtn">🔊</button></div></div>
    <div class="logo">Draw &amp; Pass<small>그림 릴레이 · 듣고 그리고, 보고 골라요</small></div>
    <img src="assets/flat.png" style="position:absolute;left:calc(var(--u)*6);bottom:calc(var(--u)*4);height:calc(var(--u)*20)" alt="Flat One">
    <div style="position:absolute;left:calc(var(--u)*16);bottom:calc(var(--u)*20);font-size:calc(var(--u)*7)" class="emo">🌈✏️</div>
    <img src="assets/party_joy.png" style="position:absolute;right:calc(var(--u)*30);bottom:calc(var(--u)*3);height:calc(var(--u)*22)" alt="">
    <img src="assets/long.png" style="position:absolute;right:calc(var(--u)*8);bottom:calc(var(--u)*3);height:calc(var(--u)*36)" alt="">
    <div class="coll" style="top:calc(var(--u)*14);right:calc(var(--u)*5)"><div class="k">🎨</div>Relay Book<br><b id="collCount">0</b></div>
    <div id="modeBox"><button class="chip on" data-mode="solo">혼자 하기</button><button class="chip" data-mode="class">교실 릴레이</button>
      <span id="lineBox">· 줄 인원 <button class="chip on" data-n="4">4명</button><button class="chip" data-n="6">6명</button><button class="chip" data-n="8">8명</button></span></div>
    <div class="agebox">연령(보호자 설정) <button class="chip" data-age="6">6세</button><button class="chip" data-age="7">7세</button><button class="chip" data-age="8">초1</button></div>
    <button class="btn start" id="startBtn">START</button>
  </section>

  <section class="screen" id="game">
    <div class="topbar">
      <div class="row"><div class="pill">⭐ <span id="starSum">0</span></div><div class="progress" id="progress"></div></div>
      <div class="row"><div class="pill" id="lvPill">LEVEL 1</div><button class="btn alt" id="reQ">💬 <span id="reLeft"></span></button></div>
      <div class="row"><button class="btn alt sndBtn">🔊</button><button class="btn" id="exitBtn">✕</button></div>
    </div>
    <img id="flat" src="assets/flat.png" alt="Flat One">
    <div id="board">
      <canvas id="cv"></canvas>
      <div class="pane" id="cmp"><div class="half"><div class="lab">내 그림 · My picture</div><img id="myImg" alt=""></div><div class="half"><div class="lab">Flat One</div><div class="pic" id="ansPic"></div></div></div>
      <div class="pane" id="look"><div class="pic" id="lookPic"></div></div>
    </div>
    <div id="tools">
      <button class="tool" data-b="0"><i style="width:calc(var(--u)*1.2);height:calc(var(--u)*1.2)"></i></button>
      <button class="tool on" data-b="1"><i style="width:calc(var(--u)*2.6);height:calc(var(--u)*2.6)"></i></button>
      <button class="tool" data-b="2"><i style="width:calc(var(--u)*4.6);height:calc(var(--u)*4.6)"></i></button>
      <button class="tool" id="eraser">🧽</button><button class="tool" id="undo">↶</button>
    </div>
    <div id="colors"></div>
    <div id="timer"><i id="tbar"></i></div><div id="hg">⏳</div>
    <button class="btn green big" id="doneBtn">Done ✔</button>
    <div id="sdBtns"><button class="btn green" id="sameBtn">👍 똑같아요</button><button class="btn alt" id="diffBtn">🤔 달라요</button></div>
    <div class="options" id="options" data-hide-on-speak></div>
    <div class="bubble" id="bubble"></div>
    <div id="passCover"><div class="flag">🚩</div><h2 id="passTitle">Pass it on!</h2><p id="passSub">다음 친구에게 넘겨 주세요</p><button class="btn gold big" id="readyBtn">준비됐어요 ▶</button></div>
    <div id="rewind"><h3>🎞️ Let's watch the whole relay!</h3><div id="rwRow"></div><div id="stamp"></div><button class="btn green" id="rwDone" style="margin-top:calc(var(--u)*1.5);display:none">끝 ▶</button></div>
  </section>

  <section class="screen" id="result">
    <div class="card-res"><h2 id="resTitle">Relay Book!</h2><div class="res-hero" id="resHero"></div><div class="bigstars" id="resStars"></div><div class="resmeta" id="resMeta"></div><div id="resLv"></div>
      <div class="reswords" id="resWords"></div><div class="resmeta" id="resReward"></div>
      <div class="resbtns"><button class="btn alt" id="homeBtn">🏠 Home</button><button class="btn" id="againBtn">↻ Again</button><button class="btn green" id="nextRoundBtn">Next ▶</button></div></div>
  </section>
</div>
<script src="../_shared/kit.js"></script>
<script>
'use strict';
const {$, sleep, rnd, shuffle} = KIT;
const ageText = a => a===8 ? '초1' : a+'세';
KIT.L = {
  hello:{en:"Hi, I'm Flat One! Draw on my back!", ko:'안녕, 나는 플랫원이야! 내 등에 그림을 그려 줘!'},
  demo1:{en:'Listen and draw.', ko:'잘 듣고 그려 봐.'}, demo2:{en:'Then look and choose!', ko:'그다음 보고 골라 봐!'},
  listen:{en:'Listen.', ko:'잘 들어.'}, drawIt:{en:'Draw it!', ko:'그려 봐!'},
  timeUp:{en:"Time's up! Let's look.", ko:'시간 다 됐어! 같이 보자.'},
  together0:{en:"Let's look together!", ko:'같이 보자!'},
  compare:{en:'Here is my picture. Same or different?', ko:'내 그림이랑 봐. 똑같아, 달라?'},
  same:{en:'You drew it!', ko:'잘 그렸구나!'}, different:{en:"Let's listen again.", ko:'다시 들어 보자.'},
  ask:{en:'What is it?', ko:'이게 뭘까?'}, again:{en:'Hmm, look at the picture again.', ko:'음, 그림을 다시 봐.'},
  hColor:{en:'Look at the color!', ko:'색을 봐!'}, hSize:{en:'Look at the size!', ko:'크기를 봐!'}, hPlace:{en:'Look at the place!', ko:'자리를 봐!'}, hThing:{en:'Look at the picture!', ko:'그림을 잘 봐!'},
  idle:{en:'Pick a brush and draw!', ko:'붓을 골라 그려 봐!'}, idleChoose:{en:'Which one is it?', ko:'어느 거일까?'},
  noMore:{en:'No more listening this time.', ko:'이번엔 더 들을 수 없어.'},
  pass:{en:'Pass it on!', ko:'다음 친구에게 넘겨!'}, rewind:{en:"Let's watch the whole relay!", ko:'릴레이를 처음부터 보자!'},
  sayAll:{en:'Everybody, say the first sentence!', ko:'다 같이 처음 문장을 말해 보자!'},
  great:{en:["That's it!",'Good eyes!','You got it!','Super!'], ko:['바로 그거야!','눈이 좋구나!','맞혔어!','최고야!']},
  clear:{en:'Look at all our pictures!', ko:'우리 그림을 다 봐!'}, levelUp:{en:'Level up! Listen carefully!', ko:'레벨 업! 더 잘 들어 봐!'},
};
KIT.face = f => { if(f==='joy') KIT.anim($('flat'),'bounce'); if(f==='oops') KIT.anim($('flat'),'oops'); };

/* ---------- content (TRD 4-1, 5-1) ---------- */
const PAL = {red:'#e94b4b', orange:'#f28c28', yellow:'#f5c842', green:'#4cb963', blue:'#3d7be0', purple:'#9b5de5', brown:'#9a6b43', black:'#2b2b2b'};
const PHRASE_COLORS = ['red','blue','yellow','green','purple','orange'];
const SV = {
  ball:c=>`<svg viewBox="0 0 100 100"><circle cx="50" cy="52" r="38" fill="${c}"/><path d="M14 46 q36 18 72 0 M50 14 q-14 38 0 76" fill="none" stroke="#fff" stroke-width="5" opacity=".75"/></svg>`,
  balloon:c=>`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="40" rx="28" ry="33" fill="${c}"/><path d="M46 73 l8 0 l-4 6z" fill="${c}"/><path d="M50 79 q-8 8 0 16" fill="none" stroke="#555" stroke-width="2"/></svg>`,
  hat:c=>`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="74" rx="42" ry="10" fill="${c}"/><path d="M28 74 V40 a22 14 0 0 1 44 0 V74z" fill="${c}"/><rect x="28" y="60" width="44" height="7" fill="#fff" opacity=".55"/></svg>`,
  fish:c=>`<svg viewBox="0 0 100 100"><ellipse cx="44" cy="52" rx="30" ry="20" fill="${c}"/><path d="M70 52 L94 34 L94 70z" fill="${c}"/><circle cx="30" cy="47" r="4" fill="#fff"/><circle cx="30" cy="47" r="2" fill="#222"/></svg>`,
  kite:c=>`<svg viewBox="0 0 100 100"><path d="M50 6 L80 40 L50 74 L20 40z" fill="${c}"/><path d="M50 6 V74 M20 40 H80" stroke="#fff" stroke-width="3" opacity=".6"/><path d="M50 74 q8 8 0 12 q-8 4 0 10" fill="none" stroke="#555" stroke-width="2"/></svg>`,
  star:c=>`<svg viewBox="0 0 100 100"><path d="M50 8 L61 38 L94 39 L68 59 L77 91 L50 72 L23 91 L32 59 L6 39 L39 38z" fill="${c}"/></svg>`,
  frog:c=>`<svg viewBox="0 0 100 100"><ellipse cx="50" cy="64" rx="38" ry="26" fill="${c}"/><circle cx="32" cy="38" r="12" fill="${c}"/><circle cx="68" cy="38" r="12" fill="${c}"/><circle cx="32" cy="38" r="6" fill="#fff"/><circle cx="68" cy="38" r="6" fill="#fff"/><circle cx="32" cy="39" r="3" fill="#222"/><circle cx="68" cy="39" r="3" fill="#222"/><path d="M36 68 q14 10 28 0" fill="none" stroke="#222" stroke-width="2.5"/></svg>`,
  mug:c=>KIT.SVG.mug(c), mitt:c=>KIT.SVG.mitt(c), mushroom:c=>KIT.SVG.mushroom(c),
  box:()=>`<svg viewBox="0 0 100 100"><path d="M8 30 H92 V92 H8z" fill="#c8925a"/><path d="M8 30 L18 18 H82 L92 30z" fill="#a8743f"/><rect x="8" y="30" width="84" height="8" fill="#000" opacity=".1"/></svg>`,
  table:()=>`<svg viewBox="0 0 100 100"><rect x="4" y="30" width="92" height="10" rx="3" fill="#9a6b43"/><rect x="12" y="40" width="8" height="54" fill="#7d5434"/><rect x="80" y="40" width="8" height="54" fill="#7d5434"/></svg>`,
};
const NOUNS6 = ['ball','hat','fish','kite','balloon','star','mug','mitt'];
const NOUNS7 = ['ball','hat','fish','kite','frog','balloon','star','mug'];
const SIMILAR = {ball:'balloon', balloon:'ball', hat:'mug', mug:'hat', kite:'fish', fish:'kite', star:'kite', frog:'fish', mitt:'hat'};
const SUBJ = {cat:'🐱', dog:'🐶', duck:'🦆', mouse:'🐭'};
const POS_BY_LV = lv => lv<=2? ['on','in'] : lv<=4? ['on','in','under'] : ['on','in','under','next to'];
const QCOUNT = {6:5, 7:5, 8:6};
const LV = { // TRD 6-2
  1:{t:90,re:99,o6:2,o7:3,diff:'noun',rough:''}, 2:{t:80,re:99,o6:3,o7:3,diff:'noun',rough:''}, 3:{t:70,re:3,o6:3,o7:4,diff:'color',rough:'r1'},
  4:{t:60,re:2,o6:3,o7:4,diff:'colorsize',rough:'r1'}, 5:{t:60,re:2,o6:3,o7:4,diff:'any',rough:'r1'}, 6:{t:60,re:1,o6:3,o7:4,diff:'any+',rough:'r2'} };

function objFor(pos){ return pos==='in' ? 'box' : pos==='under' ? 'table' : rnd(['box','table']); }
function newSpec(age, lv){
  if(age===6) return {color:rnd(PHRASE_COLORS), noun:rnd(NOUNS6)};
  if(age===7) return {size:rnd(['big','small']), color:rnd(PHRASE_COLORS), noun:rnd(NOUNS7)};
  const pos=rnd(POS_BY_LV(lv)); return {subj:rnd(Object.keys(SUBJ)), pos, obj:objFor(pos)};
}
const phraseOf = s => s.subj ? `The ${s.subj} is ${s.pos} the ${s.obj}.` : s.size ? `a ${s.size} ${s.color} ${s.noun}` : `a ${s.color} ${s.noun}`;
const keysOf = s => s.subj ? [s.subj, s.pos.split(' ')[0], s.obj] : s.size ? [s.size, s.color, s.noun] : [s.color, s.noun];
const partsOf = s => s.subj ? [`The ${s.subj}`, s.pos, `the ${s.obj}`] : s.size ? [s.size, s.color, s.noun] : [s.color, s.noun];
const same = (a,b) => phraseOf(a)===phraseOf(b);

/* options differing by ONE element (TRD 4-1) */
function elementsFor(age, lv){ const d=LV[lv].diff;
  if(age===8){ if(d==='noun') return ['subj']; if(d==='color') return ['pos']; if(d==='colorsize') return ['pos','subj']; return ['subj','pos','obj']; }
  if(d==='noun') return ['noun']; if(d==='color') return ['color']; if(d==='colorsize') return age===7? ['color','size'] : ['color']; return age===7? ['noun','color','size'] : ['noun','color']; }
function variant(s, el, lv, age){ const v={...s};
  if(el==='color') v.color=rnd(PHRASE_COLORS.filter(c=>c!==s.color));
  if(el==='size') v.size = s.size==='big'?'small':'big';
  if(el==='noun'){ const pool = age===7?NOUNS7:NOUNS6; v.noun = (LV[lv].diff==='any+' && SIMILAR[s.noun] && Math.random()<.6) ? SIMILAR[s.noun] : rnd(pool.filter(n=>n!==s.noun)); }
  if(el==='subj') v.subj=rnd(Object.keys(SUBJ).filter(x=>x!==s.subj));
  if(el==='pos'){ const ps=POS_BY_LV(Math.max(lv,3)).filter(p=>p!==s.pos); v.pos=rnd(ps); v.obj = v.pos==='in'?'box': v.pos==='under'?'table': s.obj; if(v.pos!=='in'&&v.pos!=='under'&&s.obj!==v.obj) v.obj=s.obj; }
  if(el==='obj'){ if(s.pos==='in'||s.pos==='under'){ return variant(s,'pos',lv,age); } v.obj = s.obj==='box'?'table':'box'; }
  v.changed=el; return v; }
function makeOptions(ans, age, lv, n){ const els=elementsFor(age,lv); const out=[ans]; let guard=0;
  while(out.length<n && guard++<200){ const v=variant(ans, rnd(els), lv, age); if(!out.some(o=>same(o,v))) out.push(v); }
  return shuffle(out); }

/* picture renderer (answer / kid-style) */
function picHTML(s, rough){ const r = rough? ` ${rough}` : '';
  if(s.subj){ const obj=SV[s.obj](); const emo=SUBJ[s.subj];
    const objBox = s.obj==='box' ? 'left:30%;width:40%;top:48%;height:46%' : 'left:22%;width:56%;top:40%;height:56%';
    const subPos = {on:'left:35%;width:30%;top:24%;height:34%',
                    in:'left:36%;width:28%;top:34%;height:30%', under:'left:37%;width:26%;top:64%;height:30%', 'next to':'left:80%;width:18%;top:62%;height:30%'}[s.pos];
    const sub=`<div class="o" style="${subPos};font-size:calc(var(--u)*9)"><span class="emo">${emo}</span></div>`; const ob=`<div class="o" style="${objBox}">${obj}</div>`;
    return `<div class="pic${r}">${s.pos==='in'? sub+ob : ob+sub}</div>`; }
  const big = !s.size || s.size==='big'; const box = big? 'left:12%;width:76%;top:10%;height:80%' : 'left:35%;width:30%;top:58%;height:34%';
  return `<div class="pic${r}"><div class="o" style="${box}">${SV[s.noun](PAL[s.color])}</div></div>`; }

/* ---------- drawing board (TRD 3, 9) — kept in memory only ---------- */
const cv=$('cv'), ctx=cv.getContext('2d'); let strokes=[], undoLeft=5, brush=1, color='red', eraser=false, cur=null; const pointers=new Set();
const BR=[0.008,0.018,0.035];
function sizeCanvas(){ const r=$('board').getBoundingClientRect(), dpr=devicePixelRatio||1; cv.width=Math.max(1,Math.round(r.width*dpr)); cv.height=Math.max(1,Math.round(r.height*dpr)); redrawAll(); }
addEventListener('resize', ()=>{ if($('board').classList.contains('drawing')) sizeCanvas(); });
function drawStroke(s){ ctx.save(); ctx.globalCompositeOperation = s.erase? 'destination-out' : 'source-over'; ctx.strokeStyle=PAL[s.color]||'#000'; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.lineWidth=s.w*cv.width;
  ctx.beginPath(); s.pts.forEach(([x,y],i)=>{ const X=x*cv.width, Y=y*cv.height; if(i===0) ctx.moveTo(X,Y); else ctx.lineTo(X,Y); }); if(s.pts.length===1){ ctx.lineTo(s.pts[0][0]*cv.width+.1, s.pts[0][1]*cv.height); } ctx.stroke(); ctx.restore(); }
function redrawAll(){ ctx.clearRect(0,0,cv.width,cv.height); strokes.forEach(drawStroke); }
function clearBoard(){ strokes=[]; undoLeft=5; cur=null; ctx.clearRect(0,0,cv.width,cv.height); }
const norm = e => { const r=cv.getBoundingClientRect(); return [(e.clientX-r.left)/r.width, (e.clientY-r.top)/r.height]; };
cv.addEventListener('pointerdown', e=>{ if(!G||G.phase!=='draw') return; pointers.add(e.pointerId); if(pointers.size>1){ if(cur){ strokes.pop(); cur=null; redrawAll(); } return; } // palm rejection
  cv.setPointerCapture(e.pointerId); cur={color, w:BR[brush]*(eraser?1.8:1), erase:eraser, pts:[norm(e)]}; strokes.push(cur); drawStroke(cur); touched(); });
cv.addEventListener('pointermove', e=>{ if(!cur||pointers.size>1) return; const p=norm(e); cur.pts.push([Math.max(0,Math.min(1,p[0])), Math.max(0,Math.min(1,p[1]))]); redrawAll(); });
const up = e=>{ pointers.delete(e.pointerId); cur=null; }; cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
document.querySelectorAll('.tool[data-b]').forEach(b=>b.onclick=()=>{ brush=+b.dataset.b; eraser=false; refreshTools(); });
$('eraser').onclick=()=>{ eraser=!eraser; refreshTools(); };
$('undo').onclick=()=>{ if(strokes.length && undoLeft>0){ strokes.pop(); undoLeft--; redrawAll(); KIT.sfx.click(); } };
(function(){ const box=$('colors'); Object.keys(PAL).forEach((c,i)=>{ const d=document.createElement('div'); d.className='sw'+(c==='red'?' on':''); d.style.background=PAL[c]; d.dataset.c=c; d.title=c; d.onclick=()=>{ color=c; eraser=false; refreshTools(); }; box.appendChild(d); }); })();
function refreshTools(){ document.querySelectorAll('.tool[data-b]').forEach(b=>b.classList.toggle('on', !eraser && +b.dataset.b===brush)); $('eraser').classList.toggle('on',eraser); document.querySelectorAll('.sw').forEach(s=>s.classList.toggle('on', !eraser && s.dataset.c===color)); }
function autoStroke(){ // QA: ?autodraw=1
  const pts=[]; for(let i=0;i<=24;i++){ const a=i/24*Math.PI*2; pts.push([.5+.18*Math.cos(a), .5+.28*Math.sin(a)]); } strokes.push({color, w:BR[1], erase:false, pts}); redrawAll(); }

/* ---------- flow ---------- */
let G=null, MODE='solo', LINE=4;
document.querySelectorAll('.chip[data-mode]').forEach(c=>c.onclick=()=>{ MODE=c.dataset.mode; document.querySelectorAll('.chip[data-mode]').forEach(x=>x.classList.toggle('on',x===c)); $('lineBox').classList.toggle('on', MODE==='class'); });
document.querySelectorAll('.chip[data-n]').forEach(c=>c.onclick=()=>{ LINE=+c.dataset.n; document.querySelectorAll('.chip[data-n]').forEach(x=>x.classList.toggle('on',x===c)); });
function setPhase(ph){ G.phase=ph; const st=$('stage');
  st.classList.toggle('drawing-ui', ph==='draw'); $('board').classList.toggle('drawing', ph==='draw');
  $('cmp').classList.toggle('on', ph==='compare'); $('look').classList.toggle('on', ph==='choose'||ph==='speak'); $('sdBtns').classList.toggle('on', ph==='compare');
  if(ph!=='choose' && ph!=='speak') $('options').innerHTML=''; }
function touched(){ if(!G) return; KIT.clearIdle(); KIT.armIdle(idle); }
async function idle(){ if(!G||!G.accepting) return; if(G.phase==='draw'){ await KIT.tutor('idle'); KIT.showHand($('board')); } else if(G.phase==='choose'){ await KIT.tutor('idleChoose'); KIT.showHand($('options').firstChild); } }
function updRe(){ const L=LV[G.lv].re; $('reLeft').textContent = L>=99? '' : Math.max(0,L-G.reUsed); }
$('reQ').onclick=async()=>{ if(!G||G.phase!=='draw'||!G.drawSpec) return; const L=LV[G.lv].re; if(G.reUsed>=L){ await KIT.tutor('noMore'); return; } G.reUsed++; updRe(); await KIT.say(phraseOf(G.drawSpec)); };

async function startRound(){
  if(KIT.SAVE.age<6){ KIT.SAVE.age=6; KIT.writeSave(); }
  const age=KIT.SAVE.age, lv=KIT.levelFor(age);
  G={age, lv, mode:MODE, total: MODE==='class'? LINE : QCOUNT[age], idx:0, stars:[], words:[], drawings:[], drawn:0, lastEl:[]}; const me=G;
  $('lvPill').textContent=`LEVEL ${lv} · ${ageText(age)}`; KIT.show('game'); KIT.renderProgress(G); sizeCanvas(); clearBoard(); refreshTools();
  $('progress').style.visibility = MODE==='class' ? 'hidden' : 'visible';
  if(MODE==='class') return startRelay();
  if(KIT.demoNeeded()) await runDemo(); if(G!==me) return; nextQ(true);
}
async function nextQ(first){ if(!G) return; if(!first){ await sleep(600); if(!G) return; G.idx++; }
  if(G.idx>=G.total) return finish();
  const me=G; G.wrong=0; G.accepting=false; G.reUsed=0; updRe(); KIT.renderProgress(G);
  G.drawSpec=newSpec(G.age,G.lv); await drawStep(G.drawSpec); if(G!==me) return;
  await compareStep(); if(G!==me) return;
  await chooseStep(); }
/* step 1: listen & draw */
function drawStep(spec){ return new Promise(async res=>{ const me=G; clearBoard(); setPhase('draw'); sizeCanvas(); G.accepting=false;
  KIT.face('neutral'); await KIT.tutor('listen',{keep:true}); if(G!==me) return; await KIT.say(phraseOf(spec)); if(G!==me) return; await KIT.tutor('drawIt'); if(G!==me) return;
  G.accepting=true; KIT.armIdle(idle); const T=LV[G.lv].t; const bar=$('tbar'); bar.style.transition='none'; bar.style.width='100%'; void bar.offsetWidth; bar.style.transition=`width ${T}s linear`; bar.style.width='0%';
  let done=false; const fin=async(timeUp)=>{ if(done||G!==me) return; done=true; clearTimeout(G.drawT); KIT.clearIdle(); G.accepting=false; bar.style.transition='none';
    if(timeUp) await KIT.tutor('timeUp'); G.drawn++; G.lastDrawing = strokes.length? cv.toDataURL('image/png') : null; res(); };
  G.finishDraw=()=>fin(false); G.drawT=setTimeout(()=>fin(true), T*1000);
  if(KIT.params.get('autodraw')){ await sleep(300); autoStroke(); fin(false); } }); }
$('doneBtn').onclick=()=>{ if(G&&G.phase==='draw'&&G.finishDraw) G.finishDraw(); };
/* step 2: self check (never machine-scored) */
function compareStep(){ return new Promise(async res=>{ const me=G; setPhase('compare'); $('ansPic').innerHTML=picHTML(G.drawSpec,'');
  const img=$('myImg'); if(G.lastDrawing){ img.src=G.lastDrawing; img.style.visibility='visible'; } else { img.removeAttribute('src'); img.style.visibility='hidden'; }
  if(!G.lastDrawing){ await KIT.tutor('together0'); if(G!==me) return; }
  await KIT.tutor('compare',{keep:true}); if(G!==me) return; await KIT.say(phraseOf(G.drawSpec)); if(G!==me) return;
  G.accepting=true; G.sdPick=async(isSame)=>{ if(!G.accepting) return; G.accepting=false; KIT.sfx.click();
    if(isSame){ KIT.face('joy'); await KIT.tutor('same'); } else { await KIT.tutor('different'); for(const p of partsOf(G.drawSpec)){ if(G!==me) return; await KIT.say(p); await sleep(250); } }
    if(G!==me) return; G.lastDrawing=null; img.removeAttribute('src'); clearBoard(); res(); }; }); }
$('sameBtn').onclick=()=>G&&G.sdPick&&G.sdPick(true); $('diffBtn').onclick=()=>G&&G.sdPick&&G.sdPick(false);
/* step 3: look & choose */
async function chooseStep(){ const me=G; const ans=G.lookSpec=newSpec(G.age,G.lv); const n = G.age===6? LV[G.lv].o6 : LV[G.lv].o7;
  G.opts=makeOptions(ans,G.age,G.lv,n); setPhase('choose'); $('lookPic').innerHTML=picHTML(ans, LV[G.lv].rough);
  renderOptions(G.opts, onPick); await KIT.tutor('ask'); if(G!==me) return; G.accepting=true; KIT.armIdle(idle); }
function renderOptions(list, pick){ const box=$('options'); box.innerHTML=''; list.forEach(o=>{ const c=document.createElement('div'); c.className='ocard'; c.dataset.p=phraseOf(o);
  c.innerHTML = G.age===6? `<div class="mini">${picHTML(o,'')}</div>` : phraseOf(o);
  const sp=document.createElement('button'); sp.className='spk'; sp.textContent='🔊'; sp.onclick=e=>{ e.stopPropagation(); KIT.say(phraseOf(o)); }; c.appendChild(sp);
  c.onclick=()=>pick(c,o); box.appendChild(c); }); }
async function onPick(card, o){ if(!G||!G.accepting||G.phase!=='choose') return; touched(); const me=G; KIT.say(phraseOf(o));
  if(same(o,G.lookSpec)){ G.accepting=false; KIT.clearIdle(); card.classList.add('ok'); KIT.sfx.ok(); KIT.face('joy');
    const g=KIT.line('great'); KIT.bubble(g.t+(g.lang==='ko'?`<span class="en">${g.en}</span>`:'')); await KIT.say(g.t,g.lang); if(G!==me) return;
    const star=1+(G.wrong===0?1:0); setPhase('speak'); const spoke=await KIT.speak({phrase:phraseOf(G.lookSpec), keys:keysOf(G.lookSpec), isAlive:()=>G===me}); if(G!==me) return;
    record(star+(spoke?1:0), spoke); return nextQ(); }
  G.wrong++; KIT.sfx.bad(); card.classList.add('dim'); KIT.face('oops');
  if(G.wrong===1) await KIT.tutor('again');
  else if(G.wrong===2){ const el=o.changed; await KIT.tutor(el==='color'?'hColor': el==='size'?'hSize': el==='pos'?'hPlace':'hThing'); }
  else { G.accepting=false; KIT.clearIdle(); const ok=[...$('options').children].find(c=>c.dataset.p===phraseOf(G.lookSpec)); ok&&ok.classList.add('ok'); await KIT.sayLine(phraseOf(G.lookSpec)); if(G!==me) return; record(0,false); return nextQ(); } }
function record(s, spoke){ G.stars[G.idx]=s; const ph=phraseOf(G.lookSpec); G.words.push({text:ph, phrase:ph, stars:s, spoke}); KIT.renderProgress(G); }

async function runDemo(){ KIT.demoStart(); const me=G; const spec={color:'red', noun:'ball'};
  const steps=[ async()=>{ setPhase('draw'); sizeCanvas(); clearBoard(); await KIT.tutor('demo1',{keep:true}); await KIT.say('A red ball.'); },
    async()=>{ KIT.showHand($('board'),true); autoStroke(); await sleep(900); },
    async()=>{ setPhase('compare'); $('myImg').src=cv.toDataURL(); $('myImg').style.visibility='visible'; $('ansPic').innerHTML=picHTML(spec,''); KIT.showHand($('sameBtn'),true); await sleep(1000); },
    async()=>{ await KIT.tutor('demo2',{keep:true}); setPhase('choose'); $('lookPic').innerHTML=picHTML(spec,''); renderOptions([spec,{color:'blue',noun:'ball'},{color:'red',noun:'hat'}], ()=>{}); await sleep(500); KIT.showHand($('options').firstChild,true); await sleep(900); },
    async()=>{ KIT.hideHand(); await KIT.tutor('demoEnd',{keep:true}); } ];
  for(const s of steps){ if(KIT.skipDemo||G!==me) break; await s(); }
  KIT.demoEnd(); if(G){ clearBoard(); $('myImg').removeAttribute('src'); setPhase('none'); } }

async function finish(){ KIT.clearIdle(); clearBoard(); G.drawings=[]; KIT.SAVE.bank += G.drawn; // paint drop per drawing (TRD 7)
  await KIT.result(G,{title:'Relay Book!', heroHtml:'<img src="assets/flat.png"><img src="assets/big.png"><img src="assets/feet.png"><img src="assets/long.png">', icon:'🎨', unit:'물감 방울', collName:'Relay Book', per:5}); }

/* ---------- classroom relay: one tablet passed around (TRD 2, stage A) ---------- */
async function startRelay(){ const me=G; G.relay={first:newSpec(G.age,G.lv), steps:[]};
  for(let i=0;i<G.total;i++){ if(G!==me) return; G.idx=i;
    await passCover(i); if(G!==me) return;
    if(i%2===0){ const spec = i===0? G.relay.first : G.relay.steps[i-1].spec; G.drawSpec=spec; G.reUsed=0; updRe(); await drawStep(spec); if(G!==me) return;
      G.relay.steps.push({kind:'draw', img:G.lastDrawing, spec}); G.lastDrawing=null; clearBoard(); }
    else { const prev=G.relay.steps[i-1]; const n = G.age===6? 3 : 4; const opts=makeOptions(G.relay.first, G.age, Math.max(G.lv,3), n);
      setPhase('choose'); $('lookPic').innerHTML = prev.img? `<img src="${prev.img}" style="width:100%;height:100%;object-fit:contain">` : '';
      const chosen = await new Promise(async res=>{ renderOptions(opts, (c,o)=>{ if(!G.accepting) return; G.accepting=false; KIT.clearIdle(); c.classList.add('ok'); KIT.sfx.click(); KIT.say(phraseOf(o)); setTimeout(()=>res(o),700); });
        await KIT.tutor('ask'); if(G!==me) return; G.accepting=true; KIT.armIdle(idle); });
      if(G!==me) return; G.relay.steps.push({kind:'choose', spec:chosen}); } }
  if(G!==me) return; await rewind(); }
function passCover(i){ return new Promise(async res=>{ const me=G; setPhase('none'); const pc=$('passCover');
  $('passTitle').textContent = i===0? `1번 친구부터!` : 'Pass it on!'; $('passSub').textContent = `${i+1}번 친구 차례 · ${i%2===0?'듣고 그려요 🎧':'보고 골라요 👀'}`; pc.classList.add('on');
  if(i>0){ KIT.anim($('flat'),'bounce'); $('flat').classList.add('slide'); setTimeout(()=>$('flat').classList.remove('slide'),1000); KIT.tutor('pass'); }
  G.passReady=()=>{ pc.classList.remove('on'); G.passReady=null; res(); }; }); }
$('readyBtn').onclick=()=>{ KIT.sfx.click(); G&&G.passReady&&G.passReady(); };
async function rewind(){ const me=G, R=G.relay; setPhase('none'); const rw=$('rewind'), row=$('rwRow'); row.innerHTML=''; $('stamp').textContent=''; $('rwDone').style.display='none'; rw.classList.add('on');
  const items=[{t:'처음 문장', html:`<b>${phraseOf(R.first)}</b>`, say:phraseOf(R.first)}, ...R.steps.map((s,i)=>s.kind==='draw'? {t:`${i+1}번 그림`, html: s.img?`<img src="${s.img}">`:'(빈 그림)'} : {t:`${i+1}번 고른 말`, html:`<b>${phraseOf(s.spec)}</b>`, say:phraseOf(s.spec)})];
  items.forEach(it=>{ const d=document.createElement('div'); d.className='rw-step'; d.innerHTML=`<small>${it.t}</small>${it.html}`; row.appendChild(d); });
  await KIT.tutor('rewind'); const fast=KIT.params.get('autodraw');
  for(let i=0;i<items.length;i++){ if(G!==me) return; row.children[i].classList.add('on'); if(items[i].say) await KIT.say(items[i].say); await sleep(fast?150:1500); }
  const lastChoice=[...R.steps].reverse().find(s=>s.kind==='choose'); const kept = lastChoice && same(lastChoice.spec, R.first);
  $('stamp').textContent = kept? '✅ 처음 말이 끝까지 전해졌어요!' : '🔍 어디서 바뀌었을까? 함께 찾아봐요!';
  await KIT.tutor('sayAll'); if(G!==me) return; await KIT.say(phraseOf(R.first)); if(G!==me) return;
  $('rwDone').style.display='inline-block'; G.rwDone=()=>{ rw.classList.remove('on'); relayResult(); }; }
$('rwDone').onclick=()=>G&&G.rwDone&&G.rwDone();
function relayResult(){ const R=G.relay; R.steps.forEach(s=>s.img=null); // drawings cleared (TRD 10-2)
  $('resTitle').textContent='Relay Done!'; $('resHero').innerHTML='<img src="assets/flat.png"><img src="assets/party_joy.png"><img src="assets/big.png">';
  $('resStars').textContent='🎉'; $('resMeta').textContent=`${G.total}명이 함께 릴레이했어요 · 그림은 저장하지 않아요`; $('resLv').innerHTML='';
  const box=$('resWords'); box.innerHTML=''; [R.first, ...R.steps.filter(s=>s.kind==='choose').map(s=>s.spec)].forEach((s,i)=>{ const d=document.createElement('div'); d.className='rw'; d.textContent=(i===0?'처음: ':'')+phraseOf(s); d.onclick=()=>KIT.say(phraseOf(s)); box.appendChild(d); });
  $('resReward').textContent='교실 모드는 별·레벨 없이 진행해요'; KIT.show('result'); KIT.say(KIT.line('clear').t, KIT.SAVE.lang); }

KIT.init({prefix:'dp', onStart:startRound, onExit:()=>{ if(G){ clearTimeout(G.drawT); } G=null; clearBoard(); KIT.clearIdle(); $('passCover').classList.remove('on'); $('rewind').classList.remove('on'); $('stage').classList.remove('drawing-ui'); }});
if(KIT.SAVE.age<6){ KIT.SAVE.age=6; KIT.refreshTitle(); }
if(KIT.params.get('mode')==='class'){ MODE='class'; document.querySelectorAll('.chip[data-mode]').forEach(x=>x.classList.toggle('on',x.dataset.mode==='class')); $('lineBox').classList.add('on'); }
if(KIT.params.get('line')){ LINE=+KIT.params.get('line'); }
window.__dp=()=>G;
/* QA: advance the current step */
window.__dpAuto=()=>{ if(!G) return 'none';
  if(G.passReady){ G.passReady(); return 'pass'; }
  if(G.rwDone && $('rewind').classList.contains('on')){ G.rwDone(); return 'rewind'; }
  if(!G.accepting) return 'wait';
  if(G.phase==='draw'){ autoStroke(); G.finishDraw(); return 'draw'; }
  if(G.phase==='compare'){ G.sdPick(Math.random()<.5); return 'compare'; }
  if(G.phase==='choose'){ const want = G.mode==='class' ? $('options').firstChild?.dataset.p : phraseOf(G.lookSpec); const c=[...$('options').children].find(c=>c.dataset.p===want); c&&c.click(); return 'choose'; }
  return 'none'; };
</script>
